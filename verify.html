<!DOCTYPE html>
<html>
<body>
<h3>Certificate Verify</h3>
<div id="r"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbwvLa3QdCPXZ-0UKlPUBLe28clwiMIN7leL1o3XJxjTdRENzCtpUtGkZXWAcz1_zssoCw/exec";
const id=new URLSearchParams(location.search).get("cert");
fetch(`${API}?action=verify&cert=${id}`)
.then(r=>r.json())
.then(d=>{
 r.innerHTML=d.valid?"✅ VALID":"❌ INVALID";
});
</script>
</body>
</html>
